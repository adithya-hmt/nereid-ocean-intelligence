[project]
name = "nereid-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "gsw>=3.6,<4",
  "numpy>=2.2,<3",
  "openai>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyarrow>=20,<21",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
