[project]
name = "nereid-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argopy>=1.3,<2",
  "gsw>=3.6,<4",
  "netcdf4>=1.7,<2",
  "numpy>=2.2,<3",
  "pyarrow>=20,<21",
  "xarray>=2025.6,<2027",
]

[project.scripts]
nereid-prepare = "nereid_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
